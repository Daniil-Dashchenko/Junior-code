<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuniorCode — Платформа для стажировки</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="app-container">
    
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🚀 JuniorCode</h2>
        <span class="badge">JS Edition</span>
      </div>
      
      <nav class="task-list">
        <button class="task-item active">
          <span class="task-status status-success">✓</span>
          <div class="task-info">
            <span class="task-title">Разворот строки</span>
            <span class="task-difficulty easy">Легко</span>
          </div>
        </button>

        <button class="task-item">
          <span class="task-status"></span>
          <div class="task-info">
            <span class="task-title">Фильтрация массива</span>
            <span class="task-difficulty easy">Легко</span>
          </div>
        </button>

        <button class="task-item">
          <span class="task-status"></span>
          <div class="task-info">
            <span class="task-title">Факториал числа</span>
            <span class="task-difficulty medium">Средне</span>
          </div>
        </button>
      </nav>
    </aside>

    <main class="workspace">
      <div class="placeholder-content">
        <h3>Выберите задачу в меню слева, чтобы начать кодить</h3>
        <p>Здесь будет отображаться условие задачи, встроенный редактор кода и панель тестирования.</p>
      </div>
    </main>

  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
